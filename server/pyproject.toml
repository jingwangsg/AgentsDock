[project]
name = "agents-server-runtime"
version = "0.1.6"
requires-python = ">=3.10"
dependencies = [
  "claude-agent-sdk==0.2.130",
  "croniter>=6,<7",
  "cryptography>=50.0.1,<51",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "markdown-it-py>=4,<5",
  "pydantic>=2.10,<3",
  "python-dateutil>=2.9,<3",
  "python-multipart>=0.0.20,<1",
  "tzdata>=2025.2",
  # agent_server.WebSocketSendAsInUvicorn051Protocol relies on this version's sansio protocol;
  # read its docstring before changing the range.
  "uvicorn>=0.54,<0.55",
  "websockets>=13,<16",
]

[tool.uv]
package = false
no-binary-package = ["claude-agent-sdk"]
build-constraint-dependencies = [
  "hatchling==1.32.0",
  "packaging==26.3",
  "pathspec==1.1.1",
  "pluggy==1.6.0",
  "tomli==2.4.1; python_version < '3.11'",
  "tomlkit==0.15.1",
  "trove-classifiers==2026.6.1.19",
]
